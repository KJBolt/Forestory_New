version: '3.1'
services:
  web:
    build: ./dockerfiles/
    container_name: ForestoryNew
    platform: linux/x86_64
    depends_on:
      - db
    ports:
      - "8069:8069"
    restart: always
    volumes:
      - odoo-web-data:/var/lib/odoo
      # - ./config:/etc/odoo
      - ./extraaddons:/mnt/extra-addons
    environment:
      - PASSWORD_FILE=/run/secrets/postgresql_password
    secrets:
      - postgresql_password  
    cpus: 1.0
    mem_limit: 1g
    mem_reservation: 512m
  db:
    image: postgres:latest
    container_name: forestorydb
    platform: linux/x86_64
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgresql_password
      - POSTGRES_USER=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"  
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    secrets:
      - postgresql_password  
    cpus: 0.5
    mem_limit: 512m
    mem_reservation: 256m
  # pgadmin:  # Disabled for production - high CPU usage
  #   image: dpage/pgadmin4
  #   restart: always
  #   ports:
  #     - "8860:80"
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: johnbolt651@gmail.com
  #     PGADMIN_DEFAULT_PASSWORD: odoo
  #   volumes:
  #     - pgadmin-data:/var/lib/pgadmin
  nginx:
    image: nginx:latest
    restart: always
    container_name: forestry_nginx
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - .:/var/www/
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    cpus: 0.25
    mem_limit: 256m
    mem_reservation: 64m
volumes:
  odoo-web-data:
  odoo-db-data:
  pgadmin-data:
secrets:
  postgresql_password:
    file: odoo_pg_pass